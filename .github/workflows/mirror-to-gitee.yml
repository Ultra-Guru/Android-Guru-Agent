name: Mirror to Gitee

on:
  push:
    # #794：与 2026-10-06 触发去重政策对齐 —— push 只留 main 落地终态
    #（PR 分支推送无需镜像，镜像目标是 main 终态），tag 走 v* 发布序列。
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

concurrency:
  group: mirror-gitee
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Push mirror to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mirror push
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          DST_REPO: ultra-unknown/Android-Guru-Agent
        run: |
          set -euo pipefail
          git clone --bare "https://github.com/$GITHUB_REPOSITORY.git" repo.git
          cd repo.git
          for i in 1 2 3; do
            if git push --mirror "https://oauth2:$GITEE_TOKEN@gitee.com/$DST_REPO.git"; then
              echo "Mirrored to https://gitee.com/$DST_REPO"
              exit 0
            fi
            echo "attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "::error::mirror push failed after 3 attempts"
          exit 1
