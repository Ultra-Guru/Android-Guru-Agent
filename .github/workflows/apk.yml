name: APK Build

# 独立 APK 构建流水线 —— 与 CI 解耦，按需出包：
#   - workflow_dispatch: 手动触发，可选 debug / release（release 以 debug 密钥签名，产物可直接安装）
#
# ⚠️ v1.4.1 起 tag 发布已移交 release.yml（双仓库发布架构）：
#   push tag v*.*.* → 构建产物经跨仓库 PAT 发布到 Android-Guru-Agent-Release。
#   本工作流仅保留手动触发，用于临时验证构建 —— 不再在开发仓库创建 Release。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建变体'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    # T84：完整 rootfs（~300MB+/ABI）暂存 + universal（含 3 份）打包 —— 45 分钟
    # 余量不足（fetch ~1.3GB + 两次 assemble + 1.3GB APK 产出）。
    timeout-minutes: 60
    permissions:
      contents: read    # 手动验证构建只读；对外发布走 release.yml 的跨仓库 PAT
    defaults:
      run:
        # bashisms 依赖：Build 步骤的 ${VARIANT^} 首字母大写、Resolve variant 的 [[ ]]。
        # runner 默认 sh(dash) 下 `${VARIANT^}` 报 bad substitution 直接失败 —— 显式 bash。
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # 浏览器库 composite build 检出（actions/checkout 禁止越出 workspace，
      # 用嵌套路径 apex-kit-browser —— settings.gradle.kts 的嵌套兜底分支命中；
      # 本地开发仍是兄弟目录 ../apex-kit-browser，两种布局等价）
      # —— 拆库 E1 迁移期：app 依赖 com.apex.browser:{core,engine,chrome}，
      #    composite build 自动替换为本地构建；远端坐标待 E3 发布后启用。
      - name: Read apex-kit-browser pin
        id: bkitpin
        # 锁定文件 gradle/browser-kit.lock 由 sync-browser-kit 工作流自动维护。
        # #352：缺锁回退 main 保留（防御旧分支/分叉构建 —— 本流水线是手动
        # 验证构建，只验证不发货），但从静默回退升级为 warning 级可见；
        # 正式发布流水线 release.yml 同场景直接 fail-closed，不回退。
        run: |
          set -euo pipefail
          PIN=$(head -n 1 gradle/browser-kit.lock 2>/dev/null || true)
          if [ -z "$PIN" ]; then
            echo "::warning::gradle/browser-kit.lock 缺失 —— 防御性回退 browser-kit main HEAD（仅限验证构建；发布流水线 release.yml 缺锁即硬失败）"
          fi
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"
      - name: Checkout apex-kit-browser (browser-kit composite build, pinned)
        uses: actions/checkout@v4
        with:
          repository: Ultra-Guru/apex-kit-browser
          ref: ${{ steps.bkitpin.outputs.sha }}
          path: apex-kit-browser
      - name: Read apex-kit-workspace pin
        id: wkitpin
        # 工作区浏览器库（com.apex.workspace:{core,explorer}）锁定文件
        # gradle/workspace-kit.lock —— 缺锁回退 main（防御旧分支/分叉构建）。
        # 本地开发：兄弟目录 ../apex-kit-workspace 存在时 settings 自动
        # includeBuild；CI 嵌套路径同样命中兜底分支。
        run: |
          set -euo pipefail
          PIN=$(head -n 1 gradle/workspace-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"
      - name: Checkout apex-kit-workspace (workspace-kit composite build, pinned)
        uses: actions/checkout@v4
        with:
          repository: Ultra-Guru/apex-kit-workspace
          ref: ${{ steps.wkitpin.outputs.sha }}
          path: apex-kit-workspace

      - name: Verify apex-kit-browser checkout SHA
        # #352：轻量审计（纯日志、不阻塞）—— 实际检出 SHA 写入 job summary
        # 并与锁值对照，防 ref 解析异常（如锁文件误填分支名/短 SHA 时肉眼
        # 可辨）。不一致只发 ::warning 不阻塞：硬门禁是锁检出与构建本身。
        run: |
          ACTUAL=$(git -C apex-kit-browser rev-parse HEAD 2>/dev/null || true)
          PIN=$(head -n 1 gradle/browser-kit.lock 2>/dev/null || true)
          echo "browser-kit 实际检出: ${ACTUAL:-未知} / 锁定值: ${PIN:-缺锁（回退 main）}"
          {
            echo "### 🧬 apex-kit-browser 检出（#352）"
            echo "- 实际检出 SHA: \`${ACTUAL:-未知}\`"
            echo "- 锁定值: \`${PIN:-缺锁（回退 main）}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ACTUAL" ] && [ -n "$PIN" ] && [ "$ACTUAL" != "$PIN" ]; then
            echo "::warning::browser-kit 实际检出 $ACTUAL 与锁 $PIN 不一致（ref 解析异常？）"
          fi

      - name: Read apex-kit-standard pin
        id: akitpin
        # 锁定文件 gradle/standard-kit.lock 由 sync-standard-kit 工作流自动维护：
        # standard-kit main 有新绿提交 → 锁文件 bump → 本仓库 push → 全流水线
        # 以新锁定版本构建。缺锁回退 main（防御旧分支/分叉构建）。
        run: |
          set -euo pipefail
          PIN=$(head -n 1 gradle/standard-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"
      - name: Checkout apex-kit-standard (standard-loop composite build, pinned)
        uses: actions/checkout@v4
        with:
          repository: Ultra-Guru/apex-kit-standard
          ref: ${{ steps.akitpin.outputs.sha }}
          path: apex-kit-standard
      - name: Read apex-kit-loom pin
        id: lkitpin
        # 锁定文件 gradle/loom-kit.lock 由 sync-loom-kit 工作流自动维护：
        # loom-kit main 有新绿提交 → 锁文件 bump → 本仓库 push → 全流水线
        # 以新锁定版本构建。缺锁回退 main（防御旧分支/分叉构建）。
        run: |
          set -euo pipefail
          PIN=$(head -n 1 gradle/loom-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"
      - name: Checkout apex-kit-loom (loom-weave composite build, pinned)
        uses: actions/checkout@v4
        with:
          repository: Ultra-Guru/apex-kit-loom
          ref: ${{ steps.lkitpin.outputs.sha }}
          path: apex-kit-loom

      - name: Read apex-kit-courier pin
        id: ckitpin
        # 锁定文件 gradle/courier-kit.lock 由 sync-courier-kit 工作流自动维护：
        # courier-kit main 有新绿提交 → 锁文件 bump → 本仓库 push → 全流水线
        # 以新锁定版本构建。缺锁回退 main（防御旧分支/分叉构建）。
        run: |
          set -euo pipefail
          PIN=$(head -n 1 gradle/courier-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"
      - name: Checkout apex-kit-courier (courier-dispatch composite build, pinned)
        uses: actions/checkout@v4
        with:
          repository: Ultra-Guru/apex-kit-courier
          ref: ${{ steps.ckitpin.outputs.sha }}
          path: apex-kit-courier

      - name: Read apex-kit-memory pin
        id: mkitpin
        # 认知记忆库（com.apex.memkit:memory-core）锁定文件 gradle/memory-kit.lock
        # 由 sync-memory-kit 工作流自动维护：memory-kit main 有新绿提交 →
        # 锁文件 bump → 本仓库 push → 全流水线以新锁定版本构建。缺锁回退
        # main（防御旧分支/分叉构建）。
        run: |
          set -euo pipefail
          PIN=$(head -n 1 gradle/memory-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"
      - name: Checkout apex-kit-memory (memory-core composite build, pinned)
        uses: actions/checkout@v4
        with:
          repository: Ultra-Guru/apex-kit-memory
          ref: ${{ steps.mkitpin.outputs.sha }}
          path: apex-kit-memory

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # NDK 27.0.12077973 由 :terminal-native / :core:code-native 显式 ndkVersion 钉版
          #（AGP 8.13.2 时代防默认 NDK 漂移到 28.x）。sdkmanager 偶发半截安装
          #（目录在、source.properties 缺失 → CXX1101 硬失败），三重防线：
          #   1) 完整性校验先行：已完好则零开销跳过；
          #   2) sdkmanager 安装后校验，坏了立即清掉重试；
          #   3) 仍失败 → dl.google.com 官方 zip 直下兜底（免许可/免鉴权/稳定）。
          NDK_VER="27.0.12077973"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VER"
          if [ -f "$NDK_DIR/source.properties" ]; then
            echo "✅ NDK $NDK_VER 已就绪（缓存命中）"
          else
            rm -rf "$NDK_DIR"
            NDK_OK=0
            for ATTEMPT in 1 2; do
              if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                  --install "ndk;$NDK_VER" >/dev/null 2>&1 && \
                 [ -f "$NDK_DIR/source.properties" ]; then
                NDK_OK=1; break
              fi
              rm -rf "$NDK_DIR"
              sleep 5
            done
            if [ "$NDK_OK" != "1" ]; then
              echo "⚠️ sdkmanager 安装 NDK 失败 —— dl.google.com 官方 zip 直下兜底"
              rm -rf "$NDK_DIR" /tmp/ndk-r27.zip /tmp/ndk-extract
              curl -sfL --retry 3 -o /tmp/ndk-r27.zip \
                "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
              unzip -q /tmp/ndk-r27.zip -d /tmp/ndk-extract
              mkdir -p "$ANDROID_HOME/ndk"
              mv /tmp/ndk-extract/android-ndk-r27 "$NDK_DIR"
            fi
            [ -f "$NDK_DIR/source.properties" ] \
              && echo "✅ NDK $NDK_VER 就绪" \
              || { echo "::error::NDK $NDK_VER 安装失败（sdkmanager 与直下均不可用）"; exit 1; }
          fi
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK pre-installed"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14

      - name: Stage bundled Ubuntu rootfs (T83 内置交付)
        run: |
          # T83：Ubuntu rootfs 随 APK 内置（应用内下载安装已移除，基础环境离线可用）。
          # 构建期拉取 → 双重 SHA-256 校验 → 暂存为 jniLibs 伪 .so。
          # 失败即阻断构建 —— 绝不打包指纹不符的 rootfs。
          # T84 已切完整环境档（run #10 指纹，PR #131 钉值）：tag 构建产出
          # arm64 ~316MB / universal ~903MB（v1.3.0 实测）。
          scripts/fetch_rootfs.sh

      - name: Prewarm dependencies (retry on JitPack flakiness)
        run: |
          attempts=5
          for i in $(seq 1 $attempts); do
            if ./gradlew :app:dependencies \
                --configuration debugCompileClasspath \
                --write-locks \
                --stacktrace; then
              echo "✅ Dependency resolution succeeded on attempt $i"
              exit 0
            fi
            echo "⚠️ Dependency resolution attempt $i failed, retrying..."
            sleep $((i * 30))
          done
          echo "❌ Dependency resolution failed after $attempts attempts"
          exit 1

      - name: Resolve build variant
        id: variant
        run: |
          # 仅剩 workflow_dispatch 触发：变体直接取输入（默认 debug）
          echo "type=${{ inputs.build_type || 'debug' }}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          VARIANT=${{ steps.variant.outputs.type }}
          echo "🚀 Building $VARIANT APK..."
          # ${VARIANT^} = bash 首字母大写(debug→Debug, release→Release);花括号内禁止空格
          # T83：release 双产物 —— 先 universal（含全3 ABI rootfs，兼容旧设备/模拟器），
          # 再 arm64 纯净包（-PapexAbi 收窄 app 级 abiFilters，~50MB，绝大多数现代手机）。
          # 注意 1：android.injected.abi 会被模块显式 abiFilters 压过（实测无效），
          #   故用自定义 apexAbi 属性；abiFilters 是真实任务输入 → 重打包自然触发。
          # 注意 2（实测踩坑）：中间产物必须停放在任务输出目录之外（apk/ 层）——
          #   Gradle 重跑 packageRelease 时会把输出目录里的非本轮产物当 stale
          #   output 清理掉（留在 release/ 里的 universal 包会被第二次构建删除）。
          if [ "$VARIANT" = "release" ]; then
            ./gradlew ":app:assembleRelease" \
              --no-daemon \
              -Pkotlin.incremental=false \
              --stacktrace
            mv app/build/outputs/apk/release/app-release.apk \
               app/build/outputs/apk/app-universal-release.apk
            ./gradlew ":app:assembleRelease" \
              -PapexAbi=arm64-v8a \
              --no-daemon \
              -Pkotlin.incremental=false \
              --stacktrace
            mv app/build/outputs/apk/release/app-release.apk \
               app/build/outputs/apk/app-arm64-release.apk
          else
            ./gradlew ":app:assemble${VARIANT^}" \
              --no-daemon \
              -Pkotlin.incremental=false \
              --stacktrace
          fi

      - name: Collect artifact (rename with version + sha)
        id: artifact
        run: |
          VARIANT=${{ steps.variant.outputs.type }}
          APK_DIR="app/build/outputs/apk/$VARIANT"
          SHA8=$(echo "${{ github.sha }}" | cut -c1-8)
          VERSION=$(grep -oP 'versionName\s*=.*"\K[^"]+' app/build.gradle.kts)
          echo "### 📦 APK 产物" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$VARIANT" = "release" ]; then
            # T83 双产物：arm64 纯净包（内置 rootfs 仅含 arm64）+ universal（全 3 ABI）
            #（中间产物停在 apk/ 层 —— 见 Build 步骤的踩坑注释）
            # T84：完整 rootfs 后 arm64 ~300MB+ / universal ~1.3GB（du -m 实测打印）。
            mv "$APK_DIR/../app-arm64-release.apk" \
               "$APK_DIR/ApexAgent-v${VERSION}-release-arm64-${SHA8}.apk"
            mv "$APK_DIR/../app-universal-release.apk" \
               "$APK_DIR/ApexAgent-v${VERSION}-release-universal-${SHA8}.apk"
            ARM64_APK="$APK_DIR/ApexAgent-v${VERSION}-release-arm64-${SHA8}.apk"
            UNI_APK="$APK_DIR/ApexAgent-v${VERSION}-release-universal-${SHA8}.apk"
            ARM64_MB=$(du -m "$ARM64_APK" | cut -f1)
            UNI_MB=$(du -m "$UNI_APK" | cut -f1)
            echo "📦 $(basename "$ARM64_APK") — ${ARM64_MB} MB（arm64-v8a，现代手机首选）"
            echo "📦 $(basename "$UNI_APK") — ${UNI_MB} MB（全 ABI：含 armeabi-v7a / x86_64）"
            echo "path=$ARM64_APK" >> "$GITHUB_OUTPUT"
            echo "path_universal=$UNI_APK" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$ARM64_APK")" >> "$GITHUB_OUTPUT"
            echo "- 文件: \`$(basename "$ARM64_APK")\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 大小: **${ARM64_MB} MB**（arm64-v8a；内置 Ubuntu rootfs 仅含 arm64）" >> "$GITHUB_STEP_SUMMARY"
            echo "- 另出 universal: \`$(basename "$UNI_APK")\` — ${UNI_MB} MB（含全部 3 ABI）" >> "$GITHUB_STEP_SUMMARY"
            echo "- 变体: release（debug 密钥签名，可直接安装）" >> "$GITHUB_STEP_SUMMARY"
          else
            APK=$(ls "$APK_DIR"/*.apk | head -1)
            if [ -z "$APK" ]; then
              echo "❌ No APK produced in $APK_DIR"
              exit 1
            fi
            DEST="ApexAgent-v${VERSION}-${VARIANT}-${SHA8}.apk"
            mv "$APK" "$APK_DIR/$DEST"
            echo "path=$APK_DIR/$DEST" >> "$GITHUB_OUTPUT"
            echo "name=$DEST" >> "$GITHUB_OUTPUT"
            SIZE_MB=$(du -m "$APK_DIR/$DEST" | cut -f1)
            echo "📦 $DEST — ${SIZE_MB} MB"
            echo "- 文件: \`$DEST\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 大小: **${SIZE_MB} MB**" >> "$GITHUB_STEP_SUMMARY"
            echo "- 变体: $VARIANT（release 以 debug 密钥签名，可直接安装）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: apex-agent-apk-arm64
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact (universal)
        if: steps.artifact.outputs.path_universal != ''
        uses: actions/upload-artifact@v4
        with:
          name: apex-agent-apk-universal
          path: ${{ steps.artifact.outputs.path_universal }}
          if-no-files-found: error
          retention-days: 30

      # 对外发布（Release + APK + version.json + 增量补丁）已移交 release.yml：
      # 双仓库发布架构 —— 产物统一落在 Android-Guru-Agent-Release。
