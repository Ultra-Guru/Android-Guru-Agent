name: Sync Memory Kit

# ═════════════════════════════════════════════════════════════════════════════
# apex-kit-memory 自动同步（同构 sync-courier-kit / sync-loom-kit）：
#
#   memory-kit main 出现新的**全绿**提交 → 本工作流把
#   gradle/memory-kit.lock bump 到该提交并推送 main——宿主全流水线
#   （ci / apk / release）随之以新锁定版本构建。
#
#   触发源：
#   • schedule（每 30 分钟轮询兜底）；
#   • repository_dispatch（memory-kit-updated——库仓 main 全绿后的即时
#     通道，见 apex-kit-memory/.github/workflows/notify-host.yml）。
#
#   纪律：
#   • 只跟**绿**提交（check-runs 无 pending/failed；pending → 跳过本轮等下趟；
#     failed → 本工作流显式红，锁定文件绝不跟进红提交）；
#   • bump 提交**不带 [skip ci]**——那会连 ci.yml / release.yml 一起被 GitHub
#     抑制，bump 落地后既不跑 CI 也不触发发布，直到下一次无关 push（断链）；
#     本工作流无 push 触发器（schedule / repository_dispatch / dispatch），
#     不存在自触发循环，无需 skip 标记（与 sync-courier-kit 同口径）；
#   • 推送用 SYNC_PUSH_TOKEN（PAT——GITHUB_TOKEN 推送不触发下游工作流），
#     缺 secret 时显式报错退出（不留悬空提交）。
# ═════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '17,47 * * * *'
  repository_dispatch:
    types: [memory-kit-updated]
  workflow_dispatch: {}

concurrency:
  group: sync-memory-kit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Bump memory-kit lock (green commits only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout host repository
        uses: actions/checkout@v4
        with:
          # bump 推送需要 PAT（GITHUB_TOKEN 推送不触发下游工作流）
          token: ${{ secrets.SYNC_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Resolve upstream main SHA
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM_SHA=$(gh api repos/Ultra-Guru/apex-kit-memory/commits/main --jq '.sha')
          echo "sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream main @ ${UPSTREAM_SHA:0:10}"

      - name: Compare with current lock
        id: lock
        run: |
          set -euo pipefail
          CURRENT=$(head -n 1 gradle/memory-kit.lock 2>/dev/null || true)
          UPSTREAM="${{ steps.upstream.outputs.sha }}"
          if [ "${CURRENT}" = "${UPSTREAM}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "lock already @ ${UPSTREAM:0:10} — nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "lock ${CURRENT:0:10} -> ${UPSTREAM:0:10}"
          fi

      - name: Verify upstream is green
        id: green
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          UP_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          # 门禁口径镜像 sync-courier-kit：pending → 本轮跳过（等下轮 cron 兜底）；
          # failed → 显式红；skipped/neutral 容忍（continue-on-error 类作业）。
          # 显式排除 Dependabot*（长跑依赖升级）/ Gradle dependency graph（数据
          # 洞察）/ Notify host（自引用死锁）。
          GATING_FILTER='.name != "Gradle dependency graph" and (.name | startswith("Dependabot") | not) and (.name | startswith("Notify host") | not) and (.name | startswith("notify-host") | not)'
          SUMMARY=$(gh api "repos/Ultra-Guru/apex-kit-memory/commits/${UP_SHA}/check-runs" \
            --jq "([.check_runs[]? | select($GATING_FILTER)]) as \$gating |
                   {total: (\$gating | length),
                    pending: (\$gating | map(select(.status != \"completed\")) | length),
                    failed: (\$gating | map(select(.conclusion != \"success\" and .conclusion != \"skipped\" and .conclusion != \"neutral\")) | length)}")
          TOTAL=$(echo "$SUMMARY" | jq -r .total)
          PENDING=$(echo "$SUMMARY" | jq -r .pending)
          FAILED=$(echo "$SUMMARY" | jq -r .failed)
          echo "上游门禁 check-runs：total=$TOTAL pending=$PENDING failed=$FAILED"
          if [ "$TOTAL" = "0" ] || [ "$PENDING" != "0" ]; then
            echo "::notice::上游 CI 未完成或未启动 —— 本轮跳过，等待下轮触发（30 分钟 cron 兜底）"
            echo "green=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FAILED" != "0" ]; then
            echo "::error::上游 memory-kit CI 有 $FAILED 项失败 —— 拒绝同步（先修复 https://github.com/Ultra-Guru/apex-kit-memory/actions）"
            exit 1
          fi
          echo "green=true" >> "$GITHUB_OUTPUT"
          echo "✅ 上游全绿 —— 允许同步"

      - name: Bump lock and push
        if: steps.lock.outputs.changed == 'true' && steps.green.outputs.green == 'true'
        env:
          UP_SHA: ${{ steps.upstream.outputs.sha }}
          SYNC_PUSH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_PUSH_TOKEN" ]; then
            echo "::error::缺少 secrets.SYNC_PUSH_TOKEN（对本仓库有 repo 权限的 PAT）—— bump 无法触发发布流水线，请在仓库 Settings → Secrets 配置"
            exit 1
          fi
          echo "${UP_SHA}" > gradle/memory-kit.lock
          git config user.name "apex-sync-bot"
          git config user.email "sync-bot@apex-agent.local"
          git add gradle/memory-kit.lock
          # ⚠️ 提交信息不带 [skip ci]：那会抑制 ci.yml / release.yml 的 push 触发，
          # bump 落地后既不跑 CI 也不发布（直到下一次无关 push）——发布链断链。
          git commit -m "chore(sync): bump apex-kit-memory @ ${UP_SHA:0:10}" \
            -m "Automated by sync-memory-kit workflow（触发：${{ github.event_name }}）。" \
            -m "链路：memory-kit main 新绿提交 → 锁定 bump → push main → 全流水线以新锁定版本构建（新记忆内核随 APK 交付）。"
          # PAT 推送（剥离 checkout 持久化的 extraheader，防凭据串扰）
          git -c "http.https://github.com/.extraheader=" push \
            "https://x-access-token:${SYNC_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main
          echo "🚀 已推送锁定 bump —— 流水线即将以新锁定版本构建"
