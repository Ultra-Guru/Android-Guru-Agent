type: feature
component: terminal
summary: SSH/SFTP 远程文件系统（Operit §4.7 对标缺项补齐）—— 新增 RemoteSshFilesystem + TerminalSshFsTool
details: |
  补齐 Operit 对标 §4.7 明确列缺项：SSH/SFTP 远程文件系统。此前仓库只有
  GuestFilesystem（Ubuntu/PRoot rootfs 内结构化 fs），远端机器文件操作只能靠 Agent 拼
  `ssh user@host "cat > f"` 这类 shell 命令（引号地狱 + 无错误语义 + 二进制不安全）。

  新增 platform/terminal/src/main/kotlin/com/apex/agent/platform/terminal/fs/RemoteSshFilesystem.kt：
  SSHJ 0.38.0 纯 JVM SSH/SFTP 客户端封装，13 个操作（ping/read/write/append/list/stat/
  exists/mkdir/remove/move/copy/disconnect/fingerprint）。按 SshTarget 缓存 SSHClient，
  同一 target 多次操作共享一条 TCP/SSH 会话（远端 fs 常见连续十几次调用，避免每次重
  握手 + 重认证）；SSHException/IOException 抛出时丢缓存自愈。读写全走 SFTP RemoteFile
  字节通道（无 shell、无 base64 往返）—— 二进制安全由 SFTP 协议保证。主机密钥默认严
  格校验（未知 host 拒绝，防 MITM），调用方先调 fingerprint action 拿 SHA-256 指纹展示
  给用户，确认后置 trustUnknownHost=true 一次性放行（或持久化到 KnownHostsStore）。
  写门禁：单次写 ≤ 8 MiB；拒绝 remove("/") 与 remove(".")。

  新增 Agent tool TerminalSshFsTool（subaction 设计，与 TerminalFsTool 同款）：
  JSON-Schema 化 13 个 action，结构化错误 SshFsError:{InvalidInput,InvalidPath,PathDenied,
  ConnectFailed,NoSuchFile,PermissionDenied,AlreadyExists,TooLarge,RemoteFailure,IOError,
  Unknown}，description + parametersSchema 全英文（模型消费）。

  DI 接线：TerminalModule 新增 KnownHostsStore + RemoteSshFilesystem @Provides；
  ToolModule.kt 经独立 helper ToolModuleSshRegistration（SRP 预算规避，与
  ToolModuleTmuxRegistration 同款解耦）注册 TerminalSshFsTool 到 DefaultToolRegistry。

  单测 TerminalSshFsToolTest：覆盖路径缺失 / remove("/") / 未知 action / move 缺 target /
  缺 host / JSON 解析等输入校验路径（不连真实 SSH，网络 IO 留给 CI 集成测试）。

  与 tmux 多会话、PRoot rootfs 文件系统共同补齐 Operit §4.7「终端能力」对标缺项。
references: [docs/terminal/operit-rikkahub-comparison.md, platform/terminal/src/main/kotlin/com/apex/agent/platform/terminal/fs/RemoteSshFilesystem.kt, platform/terminal/src/main/kotlin/com/apex/agent/platform/terminal/tools/v2/TerminalSshFsTool.kt]
