<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Android Guru Agent — 把整个 AI 编码工作台装进一部 Android 手机">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B10"/>
      <stop offset="0.55" stop-color="#0D1622"/>
      <stop offset="1" stop-color="#0A1322"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="0.5" stop-color="#00C2D1"/>
      <stop offset="1" stop-color="#7F52FF"/>
    </linearGradient>
    <linearGradient id="titleg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4FAFF"/>
      <stop offset="0.6" stop-color="#DCF5E9"/>
      <stop offset="1" stop-color="#9FE8C4"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101C29"/>
      <stop offset="1" stop-color="#0A1420"/>
    </linearGradient>
    <linearGradient id="roboG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4BE89A"/>
      <stop offset="1" stop-color="#2FB56B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="1.15" r="0.6">
      <stop offset="0" stop-color="#00C2D1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00C2D1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.96" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#7F52FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7F52FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 H0 V28" fill="none" stroke="#22303F" stroke-opacity="0.33" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask">
      <rect width="1200" height="300" fill="url(#fadeX)"/>
    </mask>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景：深色渐变 + 电路网格 + 三向辉光 -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1200" height="300" fill="url(#glowA)"/>
  <rect width="1200" height="300" fill="url(#glowB)"/>
  <rect width="1200" height="300" fill="url(#glowC)"/>
  <rect x="40" y="8" width="1120" height="1" fill="#1E2A38"/>
  <rect x="40" y="291" width="1120" height="1" fill="#1E2A38"/>

  <!-- Android 机器人头部（品牌吉祥物） -->
  <g transform="translate(108,102)" filter="url(#softGlow)">
    <line x1="34" y1="8" x2="20" y2="-10" stroke="#3DDC84" stroke-width="5" stroke-linecap="round"/>
    <line x1="76" y1="8" x2="90" y2="-10" stroke="#3DDC84" stroke-width="5" stroke-linecap="round"/>
    <rect x="0" y="0" width="110" height="58" rx="27" fill="url(#roboG)"/>
    <circle cx="34" cy="24" r="6.5" fill="#07130C"/>
    <circle cx="76" cy="24" r="6.5" fill="#07130C"/>
  </g>

  <!-- 电路走线：机器人 → 终端 -->
  <g stroke="#00C2D1" fill="none" opacity="0.55">
    <path d="M 236 148 H 520 L 560 112 H 788" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/>
    <circle cx="236" cy="148" r="3.2" fill="#00C2D1" stroke="none"/>
    <circle cx="788" cy="112" r="3.2" fill="#00C2D1" stroke="none"/>
  </g>

  <!-- 标题区 -->
  <text x="268" y="132" font-family="'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="46" font-weight="700" letter-spacing="0.5" fill="url(#titleg)">Android <tspan fill="#3DDC84">Guru</tspan> Agent</text>
  <!-- 版本胶囊 -->
  <g>
    <rect x="742" y="98" width="54" height="26" rx="13" fill="none" stroke="#00C2D1" stroke-opacity="0.75" stroke-width="1.4"/>
    <text x="769" y="116" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#00C2D1">v1.5</text>
  </g>
  <rect x="271" y="150" width="330" height="3" rx="1.5" fill="url(#brand)"/>
  <text x="271" y="190" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="21" font-weight="600" fill="#B9E7D4">把整个 AI 编码工作台，装进一部 Android 手机</text>
  <text x="271" y="218" font-family="'Segoe UI',sans-serif" font-size="14.5" fill="#6C8FA6">The AI coding workstation that lives entirely on your phone</text>
  <text x="271" y="256" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13.5" fill="#7FA896">228 tools · 3 modes · PRoot Ubuntu 24.04 · apex-kit-memory · BYO-LLM</text>

  <!-- 终端窗口（真实能力剪影） -->
  <g transform="translate(796,58)">
    <rect x="0" y="0" width="364" height="188" rx="12" fill="url(#termBg)" stroke="#22303F" stroke-width="1.4"/>
    <path d="M 0 12 Q 0 0 12 0 H 352 Q 364 0 364 12 V 30 H 0 Z" fill="#0B141F"/>
    <line x1="0" y1="30" x2="364" y2="30" stroke="#1D2A38" stroke-width="1"/>
    <circle cx="18" cy="15" r="4.5" fill="#FF5F57"/>
    <circle cx="36" cy="15" r="4.5" fill="#FEBC2E"/>
    <circle cx="54" cy="15" r="4.5" fill="#28C840"/>
    <text x="182" y="19.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#5E7A8C">apex@ubuntu — proot</text>
    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12.5">
      <text x="18" y="56"><tspan fill="#3DDC84">apex@ubuntu:~$</tspan> <tspan fill="#E6F1F7">gradlew :app:test</tspan></text>
      <text x="18" y="80" fill="#00C2D1">✓ 383 files · 5,434 @Test · 18 workflows</text>
      <text x="18" y="104"><tspan fill="#3DDC84">apex@ubuntu:~$</tspan> <tspan fill="#E6F1F7">agent --think deep:7</tspan></text>
      <text x="18" y="128" fill="#9D8CFF">● reading   MainActivity.kt …</text>
      <text x="18" y="152" fill="#9D8CFF">● editing   UiTheme.kt <tspan fill="#3DDC84">[ok]</tspan></text>
      <text x="18" y="176"><tspan fill="#3DDC84">apex@ubuntu:~$</tspan></text>
    </g>
    <rect x="131" y="165" width="8" height="13" fill="#F0F6FC">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
