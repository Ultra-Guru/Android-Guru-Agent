<html lang="zh-CN">
<head>

<title>行数竞猜 · Line Count Quiz</title>
<style>
:root{--bg:#0a0f0c;--bg2:#0e1a12;--panel:rgba(255,255,255,.045);--pb:rgba(255,255,255,.09);--ink:#d7e4d9;--dim:#7d8f83;--green:#8fd6a0;--amber:#e0a54f;--red:#d98876;--mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
#hud{display:flex;justify-content:space-between;padding:10px 12px 4px;font-size:12px;color:var(--dim)}
#hud b{color:var(--green);font-weight:600}
#badge{color:var(--amber);white-space:nowrap}
#badge.fb{color:var(--red)}
#stage{flex:1;display:flex;flex-direction:column}
#rulerWrap{padding:10px 12px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
#rlbl{font-size:12px;color:var(--amber)}
#ruler{height:14px;border:1px solid rgba(224,165,79,.7);border-left:2px solid var(--amber);border-right:2px solid var(--amber)}
#strip{margin:6px 10px;height:64px;background:var(--panel);border:1px solid var(--pb);border-radius:12px;overflow:hidden;position:relative}
#stripTxt{position:absolute;left:0;top:0;line-height:62px;white-space:pre;font-weight:700;font-size:15px;font-family:var(--sans);color:var(--ink)}
#tnum{margin:6px 14px 0;text-align:right;font-size:12px;color:var(--dim)}
#bets{display:flex;gap:6px;padding:8px 10px 0}
.bt{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--pb);background:rgba(255,255,255,.03);color:var(--ink);font-size:22px;font-weight:700;transition:transform .08s,box-shadow .2s,border-color .2s}
.bt:active{transform:scale(.93)}
.bt.hit{border-color:var(--green);box-shadow:0 0 16px rgba(143,214,160,.4)}
#conf{display:flex;gap:8px;padding:10px 10px 0}
.bt,.cf{cursor:pointer;touch-action:manipulation}
.cf{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--pb);background:transparent;color:var(--dim);font-size:13px}
.cf.on{border-color:var(--amber);color:var(--amber)}
#reveal{margin:8px 10px;padding:14px 12px;background:var(--panel);border:1px solid var(--pb);border-radius:14px;display:none;cursor:pointer}
#raw{font-size:12px;color:var(--amber);margin-bottom:10px}
.ln{font-weight:700;font-size:15px;font-family:var(--sans);line-height:1.5;white-space:pre;overflow:hidden;margin:3px 0;opacity:0;transition:opacity .25s}
.ln.show{opacity:1}
#vd{margin-top:12px;font-size:16px;font-weight:700;min-height:40px}
#vd.ok{color:var(--green)}#vd.no{color:var(--red)}
#vd small{display:block;font-size:12px;color:var(--dim)}
#mask{position:fixed;inset:0;background:rgba(4,8,6,.82);display:flex;align-items:center;justify-content:center}
#card{width:min(330px,88vw);background:var(--bg2);border:1px solid var(--pb);border-radius:16px;padding:22px 20px;text-align:center}
#card h1{font-size:22px;color:var(--green);letter-spacing:2px}
#card p{font-family:var(--sans);font-size:13px;color:var(--ink);line-height:1.7;margin:6px 0 16px}
#stats{font-size:12px;color:var(--dim);line-height:1.9;margin-bottom:14px}
#go{font-size:16px;color:var(--green);background:transparent;border:1px solid var(--green);border-radius:12px;padding:12px 34px;cursor:pointer;min-height:48px;transition:box-shadow .2s}
#go:active{box-shadow:0 0 18px rgba(143,214,160,.5)}
@media (prefers-reduced-motion:reduce){.bt,.cf,#go,.ln{transition:none}.bt:active{transform:none}}
</style>

<script>
var P=window.Pretext,FB=!P;
if(FB)P=(function(){ // 等宽兜底（0.6em/1em 近似）
  var f=t=>({t:t,cs:[...t],ws:[...t].map(c=>c.charCodeAt(0)>255?15:9)});

(function(){ // 1-6 行押注按钮

  $('bets').innerHTML=h;
  [].forEach.call($('bets').children,(b,i)=>b.addEventListener('click',()=>bet(i+1)));
})();
$('c1').addEventListener('click',()=>setConf(1));
$('c2').addEventListener('click',()=>setConf(2));

}

  S.phase='ask';S.round++;S.bet=-1;S.li=0;S.at=0;S.vdAt=0;

  S.prep=P.prepare(S.text,FONT);
  S.seg=P.prepareWithSegments(S.text,FONT);

}

}

}

  try{
    hi=+(localStorage.getItem(HIK)||0);nb=S.score>hi;
    if(nb)localStorage.setItem(HIK,String(S.score));
    var st=JSON.parse(localStorage.getItem(STK)||'{}');
    localStorage.setItem(STK,JSON.stringify({plays:(st.plays||0)+1,hits:(st.hits||0)+S.hits,bestCombo:Math.max(st.bestCombo||0,S.maxCombo)}));
  }catch(e){}
  $('card').innerHTML='<h1>结算</h1><div id="stats">本局 '+S.score+' 分<br>命中 '+S.hits+'/10 · 最大连击 ×'+S.maxCombo+'<br>最高分 '+hi+(nb?' · 新纪录':'')+'</div><button id="go" aria-label="再来一局">再来一局</button>';
  $('go').addEventListener('click',start);
  $('mask').style.display='flex';
}
function start(){
  S.score=0;S.round=0;S.combo=0;S.maxCombo=0;S.hits=0;
  S.deck=shuffle(EZ.slice()).slice(0,3).concat(shuffle(MD.slice()),shuffle(HD.slice()).slice(0,3));
  ask();$('mask').style.display='none';
}
$('go').addEventListener('click',start);
var last=0;
function loop(ts){ // rAF 主循环，dt 钳制 ≤50ms
  requestAnimationFrame(loop);
  if(S.paused)return;
  var dt=Math.min(50,ts-last);last=ts;S.clock+=dt;
  if(S.phase==='ask'){
    S.off-=S.spd*dt/1000;
    if(S.off<-S.natW-16)S.off=S.sw;
    ST.style.transform='translateX('+S.off.toFixed(1)+'px)';
    var rem=Math.max(0,S.deadline-S.clock);
    TN.textContent=(rem/1000).toFixed(1)+'s';
    if(rem<=0)reveal();
  }else if(S.phase==='reveal'){
    if(S.li<S.lines.length&&S.clock>=S.lnAt){$('lns').children[S.li++].classList.add('show');S.lnAt=S.clock+240}
    if(S.li>=S.lines.length&&S.vdAt&&S.clock>=S.vdAt)verdict();
    if(S.at&&S.clock>=S.at){S.at=0;nextRound()}
  }
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{S.paused=document.hidden});
</script>
